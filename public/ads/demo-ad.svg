<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100" viewBox="0 0 300 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="300" height="100" fill="url(#bg)"/>
  <circle cx="250" cy="20" r="60" fill="#a855f7" opacity="0.25"/>
  <circle cx="280" cy="95" r="40" fill="#ec4899" opacity="0.2"/>

  <!-- headset -->
  <g transform="translate(222 50)" fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round">
    <path d="M-26 6 V-4 A26 26 0 0 1 26 -4 V6"/>
    <rect x="-32" y="2" width="14" height="22" rx="5" fill="#f0abfc" stroke="none"/>
    <rect x="18" y="2" width="14" height="22" rx="5" fill="#f0abfc" stroke="none"/>
    <path d="M-25 24 Q-20 34 -6 34" stroke-width="3"/>
  </g>

  <text x="16" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd" letter-spacing="2">NOVAGEAR</text>
  <text x="16" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Hear every footstep.</text>
  <rect x="16" y="66" width="86" height="22" rx="11" fill="#ffffff"/>
  <text x="59" y="81" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#5b21b6">Shop now</text>
</svg>
